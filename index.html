      let hasHandledInitialPlay = false;

      function triggerCssAnimation(player) {
        const video = player.tech().el();

        function firstPlayHandler() {
          video.classList.remove("fade-in");
          void video.offsetWidth;
          video.classList.add("fade-in");
          // this 2s already match with oshi fade-in bypass, if the value < 2 then that first start will be ignore (because already interfered by browser engine animation, not by opacity)
          // because has existed this, so, no need to edit several seconds at beginning, because it will be fade in anyway. or, jumpToNextSegment in oshi won't work in this case
          video.style.setProperty("--fade-duration", "2s");
          // Set final opacity
          video.style.setProperty(
            "--fade-opacity",
            document.getElementById("opacityMain").textContent,
          );
          localStorage.setItem("isRunningFirstPlayHandler", true);
          // After 2 seconds, set it to false
          setTimeout(() => {
            localStorage.setItem("isRunningFirstPlayHandler", "false");
          }, 2000);
          console.log("Play event fired (first time)!");
        }

        function normalPlayHandler() {
          video.classList.remove("fade-in");
          void video.offsetWidth;
          video.classList.add("fade-in");
          video.style.setProperty("--fade-duration", "0.6s");
          video.style.setProperty(
            "--fade-opacity",
            document.getElementById("opacityMain").textContent,
          );
          console.log("Play event fired (after firstplay)!");
        }

        player.on("play", function () {
          const isAtVideoStart = player.currentTime() <= 0.5;

          if (!hasHandledInitialPlay && isAtVideoStart) {
            hasHandledInitialPlay = true;
            firstPlayHandler();
            return;
          }

          if (hasHandledInitialPlay) {
            normalPlayHandler();
          }
        });
      }

      function handleDisablePhilo() {
        var t = 0,
          n = function () {
            t++;

            timestampEditor = document.querySelector("#timestamp-editor");
            if (timestampEditor !== null) {
              timestamps = timestampEditor.querySelectorAll("p");
            }

            // 2026-04-28 15:41:21: avoid loop in set timeout if not found elements above.
            (timestampEditor !== null &&
              timestamps !== null &&
              timestamps.length > 0) ||
            t >= 10
              ? (filterTimestampEditorNodes(), startTimestampMonitor())
              : setTimeout(n, 500 + 100 * t);
          };
        setTimeout(n, 300);
      }

      function getMinWatched(keyword, item) {
        // Parse JSON from item.Additional2
        // console.trace("getMinWatched with keyword", keyword, "and item", item);
        const patternsList = JSON.parse(item.Additional2.replaceAll("\'", '"'));

        // Array to store watched values that match the keyword
        const watchedValues = [];

        // Loop through each pattern in patternsList
        patternsList.forEach((pattern) => {
          // Create regex from pattern.pattern and test if it matches keyword
          try {
            const regex = new RegExp(keyword, "i"); // case-insensitive
            if (regex.test(pattern.pattern)) {
              watchedValues.push(pattern.watched);
            }
          } catch (e) {
            console.error("Invalid regex pattern:", keyword, "Error:", e);
          }
        });

        // Return the minimum of all watched values, or null if no matches found
        return watchedValues.length > 0 ? Math.min(...watchedValues) : null;
      }
      let AllPatternCanExistFromRegexMovie = ""; // declare this variable outside of the function to make it accessible globally if needed
      let patternsInSearchBox = [];

      function updatePatternOptionsFromText(text, selectionIdDatalist) {
        const datalist = document.getElementById(selectionIdDatalist);
        if (!datalist) {
          return;
        }

        datalist
          .querySelectorAll('option[data-generated="true"]')
          .forEach((option) => option.remove());

        patternsInSearchBox = (text || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((line) => {
            if (/^.+\s{1,3}-.*$/.test(line)) {
              return line.replace(/\s{1,3}-.*/, "");
            }
            return line;
          })
          .filter(Boolean);

        patternsInSearchBox.forEach((pattern) => {
          const option = document.createElement("option");
          option.value = pattern;
          option.setAttribute("data-generated", "true");
          datalist.appendChild(option);
        });
      }

      async function createPlaylist(
        movieName,
        range,
        keyword,
        series,
        allPackages,
      ) {
        subtitlePaths = [];

        console.log("before query", movieName, range, keyword);

        let data = await queryToBackend(movieName, range, keyword, series);
        let querryArray = data.final_rows;

        AllPatternCanExistFromRegexMovie = "";
        if (
          data.rowsPattern != "No existed, please add at additional info page"
        ) {
          const rowsPattern = data.rowsPattern;
          console.log("rowsPattern", rowsPattern);
          if (rowsPattern.length > 0) {
            rowsPattern.forEach((element) => {
              if (element.pattern != null) {
                AllPatternCanExistFromRegexMovie += element.pattern;
              }
            });
          }
          // console.log(
          //   "AllPatternCanExistFromRegexMovie",
          //   AllPatternCanExistFromRegexMovie,
          // );
        } else {
          AllPatternCanExistFromRegexMovie =
            "No existed, please add at additional info page";
        }
        if (allPackages.videoContainerId == "video") {
          // // only handle for the main video .
          document.getElementById("AllPatterns").value =
            AllPatternCanExistFromRegexMovie;
        }

        updatePatternOptionsFromText(
          AllPatternCanExistFromRegexMovie,
          allPackages.selectionId,
        );

        console.log("success query to backend", querryArray);

        // sort the data by ep. Also, move important' to top and action' to bottom.
        querryArray.sort((a, b) => a.ep - b.ep);
        let newQuerryArray = [];

        // there are 4 categories: important, action, consider, ignore. they will be filtered out depend on the remove box. If the remove box is empty then all will be kept.
        let removeOrKeepCategories = document
          .getElementById(allPackages.categoryId)
          .value.split(",")
          .map((item) => item.trim().toLowerCase());

        if (removeOrKeepCategories.includes("consider")) {
          removeOrKeepCategories.push("here");
          // because 2 types consider' and here' is the same: here will tell this ep already fix from begin while consider tell maybe some previous position still not note correctly
        }

        if (document.getElementById(allPackages.revertId).checked) {
          removeOrKeepCategories.forEach((category) => {
            const categoryPattern = new RegExp(
              "(?:,\\s{0,2}|`\\s{0,2}|^)" + category + "(?:\\s{0,3}[,\\n]|$)",
              "i",
            );
            newMatchingArray = querryArray.filter((item) => {
              item.Additional4 =
                item.Additional4 == null ? [] : item.Additional4;
              let contentItem = keyword != "" ? item.content : item.fullContent;
              const isCategoryPresent =
                (contentItem != null &&
                  categoryPattern.test(contentItem.toLowerCase().trim()) &&
                  !item.Additional4.includes("not" + category)) ||
                item.Additional4.includes(category);

              console.log(
                "this is the getting result:",
                item,
                "\n  ",
                isCategoryPresent,
              );
              return isCategoryPresent;
            });
            newQuerryArray.push(...newMatchingArray);
          });
          querryArray = newQuerryArray;
        } else {
          removeOrKeepCategories.forEach((category) => {
            const categoryPattern = new RegExp(
              "(?:,\\s{0,2}|`\\s{0,2}|^)" + category + "(?:\\s{0,3}[,\\n]|$)",
              "i",
            );
            querryArray = querryArray.filter((item) => {
              item.Additional4 =
                item.Additional4 == null ? [] : item.Additional4;
              let contentItem = keyword != "" ? item.content : item.fullContent;
              const isCategoryPresent =
                (contentItem != null &&
                  categoryPattern.test(contentItem.toLowerCase().trim()) &&
                  !item.Additional4.includes("not" + category)) ||
                item.Additional4.includes(category);

              return !isCategoryPresent;
            });
          });
        }

        // This is fixed content can be appear in playlist when it can be important, normal, action. Other will be filtered out depend on the remove box, if the remove is important then below will not appear important' so basicly the below code won't change.
        if (document.getElementById(allPackages.watchedId).checked) {
          if (keyword != "") {
            //only arrange the ep follow content in review mode
            var importantContent = [];
            var actionContent = [];
            var removeItems = [];

            querryArray.forEach((item, index) => {
              // the content need to contain important' key AND there is no 'notimportant' mark down in Additional4
              // or in Additional4, it includes 'important' is also ok
              item.Additional4 =
                item.Additional4 == null ? [] : item.Additional4;
              isImportant =
                (item.content != null &&
                  important_pattern.test(item.content.toLowerCase().trim()) &&
                  !item.Additional4.includes("notimportant")) ||
                item.Additional4.includes("important");
              isAction =
                (item.content != null &&
                  action_pattern.test(item.content.toLowerCase().trim()) &&
                  !item.Additional4.includes("notaction")) ||
                item.Additional4.includes("action");
              if (isImportant) {
                importantContent.push(item);
                removeItems.push(index);
              } else if (isAction) {
                actionContent.push(item);
                removeItems.push(index);
              }
            });
            querryArray = querryArray.filter(
              (item, index) => !removeItems.includes(index),
            );

            importantContent.sort(
              (a, b) => getMinWatched(keyword, a) - getMinWatched(keyword, b),
            );
            querryArray.sort(
              (a, b) => getMinWatched(keyword, a) - getMinWatched(keyword, b),
            );
            actionContent.sort(
              (a, b) => getMinWatched(keyword, a) - getMinWatched(keyword, b),
            );

            querryArray = importantContent
              .concat(querryArray)
              .concat(actionContent);
          } else {
            // fulfill null value of Additional4
            querryArray.forEach((item, index) => {
              item.Additional4 =
                item.Additional4 == null ? [] : item.Additional4;
            });

            // with full ep, use . to match 'any data' in watched
            querryArray.sort(
              (a, b) => getMinWatched(".", a) - getMinWatched(".", b),
            );
          }
        } else {
          // if not sort follow watched then at least need to fullfill these value before create Eposide
          querryArray.forEach((item, index) => {
            item.Additional4 = item.Additional4 == null ? [] : item.Additional4;
          });
        }

        videoplaylist = new Array();
        if (keyword == "") {
          for (let i = 0; i < querryArray.length; i++) {
            url = querryArray[i].url;
            name = querryArray[i].movie + "_EP" + querryArray[i].ep.toString();
            fullcontent = querryArray[i].fullContent;
            let category = querryArray[i].Additional4;
            window.queryData.push({

              Additional2: querryArray[i].Additional2, // currently no use Additional2 in fullEp.
              Additional4: querryArray[i].Additional4,
              timeParts: querryArray[i].timeParts,
            });
            subtitlePaths =
              querryArray[i].subtitle === null
                ? []
                : querryArray[i].subtitle.split("\n");
            var myMovieEp = Eposide(
              name,
              url,
              fullcontent,
              subtitlePaths,
              querryArray[i].Additional2,
              category,
              keyword,
            );

            videoplaylist.push(myMovieEp);
          }
        } else {
          for (let i = 0; i < querryArray.length; i++) {
            url = querryArray[i].outputFileName;
            if (url == undefined || url.trim() == "") {
              continue;
            }
            name = querryArray[i].outputFileName
              .split("/")
              .at(-1)
              .split(".")[0];
            content = querryArray[i].content;
            let category = querryArray[i].Additional4;
            window.queryData.push({
              name: name,
              content: content,
              Additional0: querryArray[i].Additional0,
              Additional1: querryArray[i].Additional1,
              Additional2: querryArray[i].Additional2,
              Additional4: querryArray[i].Additional4,
              timeParts: querryArray[i].timeParts,
            });

            subtitlePaths =
              querryArray[i].subtitle === null
                ? []
                : querryArray[i].subtitle.split("\n");
            var myMovieEp = Eposide(
              name,
              url,
              content,
              subtitlePaths,
              querryArray[i].Additional2,
              category,
              keyword,
            );

            videoplaylist.push(myMovieEp);
          }
        }
        // if there is no item, set new, if exist, delete the old (because there is limit in storage of localStorage, also, the query info is different between each time and key must be unique)
        localStorage.setItem("queryData", JSON.stringify(window.queryData));
        localStorage.setItem("channelName", window.channelName);
        localStorage.setItem("firstLoadingIe", firstLoadingIe);
        console.log("Just public this info:", window.queryData);
        return videoplaylist;

      function cursorDataSelection(boundaryId) {
        function insertTextAtCursor(target, text) {
          if (!target) {
            return;
          }

          const start = target.selectionStart ?? target.value.length;
          const end = target.selectionEnd ?? target.value.length;
          const nextValue =
            target.value.slice(0, start) + text + target.value.slice(end);

          target.value = nextValue;
          const cursorPosition = start + text.length;
          target.focus();
          target.setSelectionRange(cursorPosition, cursorPosition);
        }
        const divBoundary = document.getElementById(boundaryId);

        divBoundary
          .querySelectorAll("[data-insert-value]")
          .forEach((button) => {
            if (button.getAttribute("data-insert-value") == "Clear") {
              button.addEventListener("click", () => {
                keywordbox.value = "";

            } else {

                  button.getAttribute("data-insert-value"),

              });
            }
          });
      }

      // Timestamp monitoring: highlight active paragraph based on player time
      function clearTimestampMonitor() {
        if (window.timestampMonitorInterval) {
          clearInterval(window.timestampMonitorInterval);
          window.timestampMonitorInterval = null;
        }
      }

      function startTimestampMonitor() {
        clearTimestampMonitor();
        window.timestampMonitorInterval = setInterval(() => {
          // will monitor if exist the element given only.
          const timestampEditor = document.querySelector("#timestamp-editor");
          if (!timestampEditor || !window.player) return;

          // const pNodes = Array.from(timestampEditor.querySelectorAll("p"));
          // get only the visible nodes
          const pNodes = Array.from(
            timestampEditor.querySelectorAll("p"),
          ).filter((el) => {
            return window.getComputedStyle(el).display !== "none";
          });
          if (pNodes.length === 0) return;

          // Extract leading timestamps (HH:MM:SS or MM:SS) into seconds or null
          const times = pNodes.map((node) => {
            const m = (node.textContent || "").match(/^(?:\d{1,2}:){1,2}\d{2}/);
            if (!m) return null;
            const parts = m[0].split(":").map(Number);
            return parts.reduce((acc, v) => acc * 60 + v, 0);
          });

          const current =
            typeof window.player.currentTime === "function"
              ? window.player.currentTime()
              : window.player.currentTime || 0;

          let activeIndex = -1;
          for (let i = 0; i < times.length; i++) {
            if (times[i] === null) continue;
            // find next non-null time as end
            let end = Infinity;
            // i is the index of the p tag that contains the seconds in the range given, while times[i] is the seconds itself.
            for (let j = i + 1; j < times.length; j++) {
              if (times[j] !== null) {
                end = times[j];
                break;
              }
            }
            if (current >= times[i] && current < end) {
              activeIndex = i;
              break;
            }
          }

          pNodes.forEach((node, idx) => {
            if (idx === activeIndex) {
              node.style.backgroundColor = "rgba(0,120,215,0.25)"; // blue highlight
            } else {
              node.style.backgroundColor = "";
            }
          });
        }, 500);
      }

      function assignOpacity(container, initialValue, e) {
        var elements = Array.from(container.querySelectorAll("*")).filter(
          function (el) {
            // all element that is control bar or at the behind layer won't be control the opacity in merge == true
            if (merged) {
              return !(
                el.closest(".vjs-control-bar") ||
                window.getComputedStyle(el).zIndex === "1" ||
                el.closest("#timestamp-container")
              );
            } else {
              return !(
                el.closest(".vjs-control-bar") ||
                el.closest("#timestamp-container")
              );
            }
          },
        );
        elements.forEach(function (el) {
          if (e != undefined) {
            el.style.opacity = parseInt(e.target.value, 10) / 100;
          } else {
            el.style.opacity = parseInt(initialValue, 10) / 100;
          }
        });
        if (e != undefined && e.target.parentElement.id == "slider-container") {
          document.getElementById("opacityMain").textContent =
            parseInt(e.target.value, 10) / 100;
        }
      }
      function createSlider(buttonId, sliderId, mySliderId) {
        const button = document.getElementById(buttonId);
        const sliderContainer = document.getElementById(sliderId);
        const mySlider = document.getElementById(mySliderId);
        const slider = sliderContainer.querySelector("md-slider");

        let hideTimeout = null;
        let lastValue = slider.value;
        let oldTimeoutId = null;

        // Show slider on hover
        button.addEventListener("mouseenter", () => {
          sliderContainer.classList.add("visible");
          if (hideTimeout) {
            clearTimeout(hideTimeout);
            hideTimeout = null;
          }
        });

        // Start 2s timeout when mouse leaves
        mySlider.addEventListener("mouseleave", () => {
          hideTimeout = setTimeout(() => {
            clearTimeout(oldTimeoutId); // clear the old
            if (!button.matches(":hover")) {
              sliderContainer.classList.remove("visible");
            }
          }, 500);
          oldTimeoutId = hideTimeout;
        });

        // Toggle slider value on button click
        button.addEventListener("click", () => {
          if (slider.value != 0) {
            lastValue = slider.value;
            slider.value = 0;
          } else {
            slider.value = lastValue;
          }
        });

        // Listen for slider changes
        // slider.addEventListener("input", (e) => {
        //   console.log(`Slider value: ${e.target.value}`);
        // });
        return slider;
      }
